# and $00:9D30 once needed hand-written `exit_mx_at` directives so
# the v2 decoder would resume callers at the correct (m, x) after
# JSR/JSL. Without those hints, callees that internally SEP #$20
# (forcing m=1) without restoring caused the caller's decoder to
# mis-decode operand widths post-JSR — root cause of "Mario dies on
# slope" (2026-05-03).
