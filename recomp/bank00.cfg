# WRAM byte-match (g_ram_routine_guards); any mismatch falls back to the
# interpreter floor with a loud log. The `name` decls give the body its friendly
# name. $7F:812E (partial clear from slot 100) is only reached on the file-select
# path and is not yet captured, so it stays on the interpreter for now.
