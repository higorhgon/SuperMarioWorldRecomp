[General]
Autosave = 0
DisableFrameDelay = 0
SkipLauncher = 0

[Graphics]
WindowSize = Auto

# Desktop fullscreen, not "fullscreen w/ mode change" (2): on an embedded
# panel with exactly one fixed native mode, Fullscreen=1 matches the H700's
# 720x480 panel resolution exactly, which is what makes the SMW Adaptive
# Widescreen mod's "Fit to screen" mode (see mods/state.toml next to this
# file) render at the panel's real 3:2 aspect ratio with no source changes.
Fullscreen = 1
WindowScale = 3
NewRenderer = 1
IgnoreAspectRatio = 0
NoSpriteLimits = 1

# Adaptive widescreen is configured in mods/state.toml (Aspect ratio: Fit to
# screen, Enemy spawn: Screen-based), not here - see docs/adaptive-renderer.md.

# SDL (accelerated SDL_Renderer) is the safest default on the H700's
# Mali-G31/Panfrost stack: OpenGL is a separate output path in src/opengl.c
# that hard-requires an OpenGL 3.3 core context (Die("You need OpenGL 3.3")
# whenever OutputMethod=OpenGL is selected at all, not only when a shader is
# set), and Panfrost's desktop OpenGL ceiling for Bifrost-class GPUs like the
# G31 is currently 3.1 - below that requirement. SDL_Renderer does not force
# a 3.3 core context. If SDL gives you a black screen or poor performance on
# real hardware, try SDL-Software next (config.ini's own upstream comment
# already calls this out as sometimes faster "on Raspberry Pi", i.e. other
# weak-GPU ARM SBCs) before OpenGL.
OutputMethod = SDL
LinearFiltering = 0
Shader =

[Sound]
EnableAudio = 1
AudioFreq = 32040
AudioChannels = 2
AudioSamples = 512

[GamepadMap]
EnableGamepad1 = true
EnableGamepad2 = false
Deadzone = 30
Controls =   DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb
